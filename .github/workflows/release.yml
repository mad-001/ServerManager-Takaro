# Runs make-release.sh on every push to master (bundling the pinned UE4SS runtime).
# Creates a GitHub release (tag = "v" + VERSION) only when that tag does not exist yet.
# To ship a release: bump VERSION in your PR and merge it.
name: Build & Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: ver
        run: |
          v=$(tr -d '[:space:]' < VERSION | sed 's/^[vV]//')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the UE4SS runtime named in BUNDLED_UE4SS.txt
        # First line is "Bundled UE4SS: <version> (RE-UE4SS <release tag>)". Bumping that
        # line is all that is needed when upgrading UE4SS.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -nE 's/^Bundled UE4SS:[[:space:]]*([^[:space:]]+).*/\1/p' BUNDLED_UE4SS.txt | head -1)
          tag=$(sed -nE 's/.*\(RE-UE4SS[[:space:]]+([^)[:space:]]+)\).*/\1/p' BUNDLED_UE4SS.txt | head -1)
          [ -n "$ver" ] || { echo "could not parse UE4SS version from BUNDLED_UE4SS.txt" >&2; exit 1; }
          tag="${tag:-experimental-latest}"
          asset="UE4SS_v${ver}.zip"
          echo "UE4SS $ver from release $tag ($asset)"
          mkdir -p vendor
          gh release download "$tag" --repo UE4SS-RE/RE-UE4SS -p "$asset" -D vendor
          unzip -q "vendor/$asset" -d vendor   # yields vendor/ue4ss/UE4SS.dll
          test -f vendor/ue4ss/UE4SS.dll

      - name: Install cross-compilers (MinGW-w64 for the DLLs, OpenSSL headers for the .so)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++-mingw-w64-x86-64 libssl-dev

      - name: Build winmm.dll, version.dll and libtakarocore.so from source
        run: |
          chmod +x core/build.sh
          ./core/build.sh
          test -f core/winmm.dll && test -f core/version.dll && test -f core/libtakarocore.so

      - name: Build release archive
        run: |
          chmod +x make-release.sh
          ./make-release.sh "${{ steps.ver.outputs.version }}"
          mkdir -p release
          mv "ServerManager-Takaro-${{ steps.ver.outputs.tag }}.zip" release/
          cp core/libtakarocore.so release/
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - name: Create release ${{ needs.build.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.build.outputs.tag }}" \
            --title "${{ needs.build.outputs.tag }}" \
            --generate-notes \
            release/*

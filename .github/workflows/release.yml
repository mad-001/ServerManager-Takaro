# Auto-release: every push to master builds. If the current version is already
# released, the version is bumped automatically (patch by default; put the word
# #minor or #major in the PR title / merge commit for a bigger bump), the bump is committed
# back to master, and a GitHub release with generated notes is published.
# Pushes that only touch docs, markdown or CI files build but do not release.
# A version you bump by hand in a PR is used as-is.
name: Build & Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: "Force bump level (patch, minor, major); empty = auto"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      sha: ${{ steps.ver.outputs.sha }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Decide version (auto-bump when the current version is already released)
        id: ver
        shell: bash
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BUMP_INPUT: ${{ github.event.inputs.bump }}
          BRANCH: master
        run: |
          set -euo pipefail
          read_version() { tr -d '[:space:]' < VERSION | sed 's/^[vV]//'; }
          write_version() { printf '%s\n' "$1" > VERSION; }
          cur=$(read_version)
          [ -n "$cur" ] || { echo "could not read the current version" >&2; exit 1; }
          tag="v$cur"; sha=$(git rev-parse HEAD); release=true
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            relevant=false
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in docs/*|*.md|.github/*|.gitignore|LICENSE|VERSION) ;; *) relevant=true; echo "releasable change: $f";; esac
            done < <(git diff --name-only "$tag" HEAD)
            if [ "$relevant" = false ]; then
              echo "No releasable changes since $tag (docs/CI only) - build only, no release."
              release=false
            else
              level=patch
              case "${BUMP_INPUT:-}" in major|minor|patch) level=$BUMP_INPUT;; esac
              # "#major" / "#minor" must be a standalone token in the merge commit / PR title
              kw() { grep -Eq "(^|[[:space:](\[])#$1([[:space:])\].,:;!]|$)" <<< "${COMMIT_MSG:-}"; }
              if kw major; then level=major; elif kw minor; then level=minor; fi
              IFS=. read -r a b c <<< "$cur"
              case $level in
                major) a=$((a+1)); b=0; c=0;;
                minor) b=$((b+1)); c=0;;
                patch) c=$(( ${c:-0} + 1 ));;
              esac
              new="$a.$b.$c"
              write_version "$new"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -- VERSION
              git commit -m "chore: bump version to v$new [skip ci]"
              git push origin "HEAD:$BRANCH"
              tag="v$new"; sha=$(git rev-parse HEAD)
              echo "Bumped $cur -> $new ($level)"
            fi
          else
            echo "Version $cur was set by hand and is not released yet - releasing as-is."
          fi
          { echo "tag=$tag"; echo "sha=$sha"; echo "release=$release"; } >> "$GITHUB_OUTPUT"

      - name: Download the UE4SS runtime named in BUNDLED_UE4SS.txt
        # First line is "Bundled UE4SS: <version> (RE-UE4SS <release tag>)". Bumping that
        # line is all that is needed when upgrading UE4SS.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -nE 's/^Bundled UE4SS:[[:space:]]*([^[:space:]]+).*/\1/p' BUNDLED_UE4SS.txt | head -1)
          tag=$(sed -nE 's/.*\(RE-UE4SS[[:space:]]+([^)[:space:]]+)\).*/\1/p' BUNDLED_UE4SS.txt | head -1)
          [ -n "$ver" ] || { echo "could not parse UE4SS version from BUNDLED_UE4SS.txt" >&2; exit 1; }
          tag="${tag:-experimental-latest}"
          asset="UE4SS_v${ver}.zip"
          echo "UE4SS $ver from release $tag ($asset)"
          mkdir -p vendor
          gh release download "$tag" --repo UE4SS-RE/RE-UE4SS -p "$asset" -D vendor
          unzip -q "vendor/$asset" -d vendor   # yields vendor/ue4ss/UE4SS.dll
          test -f vendor/ue4ss/UE4SS.dll

      - name: Install cross-compilers (MinGW-w64 for the DLLs, OpenSSL headers for the .so)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++-mingw-w64-x86-64 libssl-dev

      - name: Build winmm.dll, version.dll and libtakarocore.so from source
        run: |
          chmod +x core/build.sh
          ./core/build.sh
          test -f core/winmm.dll && test -f core/version.dll && test -f core/libtakarocore.so

      - name: Build release archive
        run: |
          chmod +x make-release.sh
          ./make-release.sh "$(sed 's/^v//' <<< "${{ steps.ver.outputs.tag }}")"
          mkdir -p release
          mv "ServerManager-Takaro-${{ steps.ver.outputs.tag }}.zip" release/
          cp core/libtakarocore.so release/
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - name: Create release ${{ needs.build.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.build.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.build.outputs.sha }}" \
            --title "${{ needs.build.outputs.tag }}" \
            --generate-notes \
            release/*
